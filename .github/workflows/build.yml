name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - run: go mod download
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
