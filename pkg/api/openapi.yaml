  securitySchemes:
    apiKeyHeader:
      description: Organization-scoped Wodby API key. Requests are restricted to the
        key's organization.
      in: header
      name: X-API-KEY
      type: apiKey
    ciAccessTokenHeader:
      description: Short-lived CI token generated by Wodby build workflows. Only operations
        that explicitly list this scheme accept it.
      in: header
      name: X-ACCESS-TOKEN
      type: apiKey
