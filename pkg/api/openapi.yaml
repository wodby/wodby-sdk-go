          description: Error response
      summary: Get current user
      tags:
      - user
    put:
      description: Updates the authenticated user's basic profile and returns the
        updated account.
      operationId: updateCurrentUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
        required: true
      responses:
        "200":
